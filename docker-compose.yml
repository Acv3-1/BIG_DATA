# RapidGo - Variante 10 (Inventario y fulfillment)
# Kafka en modo KRaft (sin Zookeeper) + creación automática del topic.
#
# Listeners:
#   - localhost:9092 -> para el producer ejecutado desde tu PC
#   - kafka:19092    -> para otros contenedores (Spark, Airflow) en la red de Docker
#
# IMPORTANTE: el número de particiones debe coincidir con lo definido en el ADR-001.

services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: rapidgo-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # Crea el topic con varias particiones y termina.
  kafka-init:
    image: apache/kafka:3.8.0
    container_name: rapidgo-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    command:
      - /opt/kafka/bin/kafka-topics.sh
      - --bootstrap-server
      - kafka:19092
      - --create
      - --if-not-exists
      - --topic
      - inventario-fulfillment
      - --partitions
      - "3"
      - --replication-factor
      - "1"

  # Spark Structured Streaming: lee de Kafka, parsea, transforma y agrega por ventana.
  # Usa el listener interno de Kafka (kafka:19092). La versión del paquete
  # spark-sql-kafka debe coincidir con la de la imagen (3.5.3 / Scala 2.12).
  spark:
    image: apache/spark:3.5.3-python3
    container_name: rapidgo-spark
    user: "0"   # root: permite escribir Parquet y checkpoints en ./datalake (volumen montado)
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
      KAFKA_TOPIC: inventario-fulfillment
      DATALAKE_PATH: /opt/app/datalake
      PYTHONPATH: /opt/app
    volumes:
      - ./spark:/opt/app/spark:ro
      - ./datalake:/opt/app/datalake   # Raw / Processed / Curated + checkpoints
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - local[2]
      - --conf
      - spark.jars.ivy=/tmp/.ivy
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.3
      - /opt/app/spark/streaming_job.py

  # Airflow (Issue #23): un solo contenedor en modo "standalone" (scheduler + API/UI + base SQLite),
  # suficiente para el proyecto. Interfaz: http://localhost:8080 (ver airflow/README.md).
  # Ejecución local: puede arrancar solo, no depende de Kafka ni de Spark. El DAG lee ./datalake.
  airflow:
    image: apache/airflow:3.3.2-python3.13
    container_name: rapidgo-airflow
    command: standalone
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"                   # sin DAGs de ejemplo
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"     # el DAG queda listo para lanzar
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"   # sin pantalla de login (solo local)
      DATALAKE_PATH: /opt/airflow/datalake
      REPORTES_PATH: /opt/airflow/reportes                    # dentro del volumen de Airflow (ahí sí puede escribir)
    volumes:
      - airflow-home:/opt/airflow                             # base de datos, logs y configuración persisten
      - ./airflow/dags:/opt/airflow/dags
      - ./datalake:/opt/airflow/datalake:ro                   # solo lectura: Spark (root) es quien escribe aquí

volumes:
  airflow-home:
