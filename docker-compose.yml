# RapidGo - Variante 10 (Inventario y fulfillment)
# Kafka en modo KRaft (sin Zookeeper) + creación automática del topic.
#
# Listeners:
#   - localhost:9092 -> para el producer ejecutado desde tu PC
#   - kafka:19092    -> para otros contenedores (Spark, Airflow) en la red de Docker
#
# IMPORTANTE: el número de particiones debe coincidir con lo definido en el ADR-001.

services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: rapidgo-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # Crea el topic con varias particiones y termina.
  kafka-init:
    image: apache/kafka:3.8.0
    container_name: rapidgo-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    command:
      - /opt/kafka/bin/kafka-topics.sh
      - --bootstrap-server
      - kafka:19092
      - --create
      - --if-not-exists
      - --topic
      - inventario-fulfillment
      - --partitions
      - "3"
      - --replication-factor
      - "1"
