name: CI RapidGo

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:          # permite que release.yml reutilice este CI como quality gate

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Validar sintaxis Python
        run: python -m compileall producer spark tests airflow scripts

      - name: Validar DAG de Airflow (estático)
        run: python scripts/validar_dag.py

      - name: Validar evento de prueba del contrato
        run: python -m producer.producer --dry-run --count 5 --rate 1000 --seed 1

      - name: Ejecutar pruebas
        run: pytest -v

      - name: Validar Docker Compose
        run: docker compose config --quiet

  estructura:
    # Quality gate de documentación: los entregables que pide la guía deben existir.
    needs: validar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verificar archivos obligatorios
        run: |
          faltan=0
          for f in README.md docker-compose.yml requirements.txt docs/arquitectura.png \
                   docs/checkpoints/semana1.md docs/checkpoints/semana2.md docs/checkpoints/semana3.md; do
            [ -f "$f" ] || { echo "::error::Falta $f"; faltan=1; }
          done
          for n in 001 002 003; do
            ls docs/decisions/ADR-$n-*.md > /dev/null 2>&1 || { echo "::error::Falta docs/decisions/ADR-$n-*.md"; faltan=1; }
          done
          ls samples/*.json > /dev/null 2>&1 || { echo "::error::Falta un ejemplo de evento en samples/"; faltan=1; }
          exit $faltan
